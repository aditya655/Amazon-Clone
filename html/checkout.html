<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Checkout</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../css/shared/general.css">
    <link rel="stylesheet" href="../css/pages/checkout/checkout-header.css">
    <link rel="stylesheet" href="../css/pages/checkout/checkout.css">
  </head>

  <body>
    <header class="checkout-header">
      <a class="header-link amazon-dark-logo" href="amazon.html">
        <img class="amazon-logo" src="../images/amazon-logo.png" alt="Amazon home">
      </a>

      <span class="checkout">
        Checkout (<a class="header-link item-count" href="amazon.html"></a>)
      </span>

      <div class="lock">
        <img class="lock-icon" src="../images/icons/checkout-lock-icon.png" alt="Secure checkout">
      </div>
    </header>

   <main class="main">
      <h1 class="page-title">Review your order</h1>

      <div class="review-order">
        <div class="cart-items"></div>
        <div class="order-summary"></div>
      </div>
    </main>

    <script type="module" src="../JavaScript/checkout.js"></script>
  </body>
</html>
